name: Web build (GHC WebAssembly backend)

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Permissions required to deploy to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent Pages deployment; don't cancel an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # ghc-wasm-meta flavour: GHC release series for the wasm32-wasi toolchain.
  FLAVOUR: '9.12'

jobs:
  build:
    name: cabal build (WebAssembly backend)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install GHC WASM toolchain (ghc-wasm-meta)
        run: |
          pushd "$(mktemp -d)"
          curl -f -L --retry 5 https://gitlab.haskell.org/haskell-wasm/ghc-wasm-meta/-/archive/master/ghc-wasm-meta-master.tar.gz | tar xz --strip-components=1
          ./setup.sh
          ~/.ghc-wasm/add_to_github_path.sh
          popd

      - name: Tool versions
        run: |
          wasm32-wasi-ghc --version
          wasm32-wasi-cabal --version

      - name: Cache cabal store
        uses: actions/cache@v4
        with:
          path: |
            ~/.ghc-wasm/.cabal/store
            web/dist-newstyle
          key: ${{ runner.os }}-wasm-${{ env.FLAVOUR }}-${{ hashFiles('web/**/*.cabal', 'web/cabal.project') }}
          restore-keys: |
            ${{ runner.os }}-wasm-${{ env.FLAVOUR }}-

      - name: Update package index
        working-directory: web
        run: wasm32-wasi-cabal update

      - name: Build (WebAssembly backend)
        working-directory: web
        run: |
          wasm32-wasi-cabal build
          echo "--- produced wasm files ---"
          find dist-newstyle -name '*.wasm'

      - name: Post-link JSFFI glue and assemble site
        run: |
          mkdir -p _site
          cp web/index.html _site/index.html
          HS_WASM="$(find web/dist-newstyle -name '*.wasm' | head -n1)"
          echo "Using: $HS_WASM"
          cp "$HS_WASM" _site/netwire01-web.wasm
          "$(wasm32-wasi-ghc --print-libdir)"/post-link.mjs --input "$HS_WASM" --output _site/ghc_wasm_jsffi.js
          ls -la _site

      - name: Smoke test (boot wasm under node)
        run: |
          SMOKE="$(mktemp -d)"
          cp _site/netwire01-web.wasm _site/ghc_wasm_jsffi.js web/smoke.mjs "$SMOKE"
          cd "$SMOKE"
          npm install --no-save @bjorn3/browser_wasi_shim@0.3.0
          node smoke.mjs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: netwire01-web
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    # Only the default branch may deploy to the github-pages environment;
    # PRs and feature branches build but do not publish.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
