<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>netwire01 — web</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    #stage { display: flex; align-items: center; justify-content: center; height: 100%; }
    canvas { background: #000; touch-action: none; max-width: 100vw; max-height: 100vh; }
    #label { position: fixed; top: 8px; left: 8px; color: #6f6; font: 14px/1.4 monospace; }

    /* On-screen controls: hidden by default, shown only on touch devices. */
    #controls { position: fixed; inset: 0; pointer-events: none; display: none; }
    #controls.touch { display: block; }
    .cluster { position: absolute; bottom: 28px; display: grid; gap: 10px; }
    .cluster.left  { left: 28px;  grid-template-columns: repeat(2, 64px); }
    .cluster.right { right: 28px; grid-template-columns: repeat(3, 64px);
                     grid-template-rows: repeat(3, 64px); }
    .btn {
      pointer-events: auto; width: 64px; height: 64px; border-radius: 12px;
      background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.35);
      color: #fff; font: 24px/64px monospace; text-align: center;
      user-select: none; -webkit-user-select: none; touch-action: none;
    }
    .btn.active { background: rgba(120,255,120,0.35); }
    /* d-pad placement in the right 3x3 cluster */
    .fwd { grid-area: 1 / 2; }  .strafeL { grid-area: 2 / 1; }
    .strafeR { grid-area: 2 / 3; }  .rev { grid-area: 3 / 2; }
  </style>
</head>
<body>
  <div id="label">loading Haskell…</div>
  <div id="stage"><canvas id="canvas" width="600" height="600"></canvas></div>

  <div id="controls">
    <div class="cluster left">
      <div class="btn" data-bit="1">&#x21BA;</div>
      <div class="btn" data-bit="2">&#x21BB;</div>
    </div>
    <div class="cluster right">
      <div class="btn fwd"     data-bit="4">&#x25B2;</div>
      <div class="btn strafeL" data-bit="16">&#x25C0;</div>
      <div class="btn strafeR" data-bit="32">&#x25B6;</div>
      <div class="btn rev"     data-bit="8">&#x25BC;</div>
    </div>
  </div>

  <script>
    // --- Control state ------------------------------------------------------
    // Bitmask shared with Haskell (web/Main.hs):
    //   1 rotL, 2 rotR, 4 forward, 8 reverse, 16 strafeL, 32 strafeR
    let CONTROL_BITS = 0;
    globalThis.controlBits = () => CONTROL_BITS;

    function setBit(b)   { CONTROL_BITS |= b; }
    function clearBit(b) { CONTROL_BITS &= ~b; }

    // Keyboard (desktop): mirrors the original WASD/arrows + Q/E.
    const KEYMAP = {
      KeyW: 4, ArrowUp: 4, KeyS: 8, ArrowDown: 8,
      KeyA: 16, ArrowLeft: 16, KeyD: 32, ArrowRight: 32,
      KeyQ: 1, KeyE: 2,
    };
    window.addEventListener('keydown', e => {
      const b = KEYMAP[e.code];
      if (b) { setBit(b); e.preventDefault(); }
    });
    window.addEventListener('keyup', e => {
      const b = KEYMAP[e.code];
      if (b) { clearBit(b); e.preventDefault(); }
    });

    // Touch buttons: multi-touch, hold-to-apply via pointer events.
    const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
    if (isTouch) document.getElementById('controls').classList.add('touch');
    for (const el of document.querySelectorAll('.btn')) {
      const bit = Number(el.dataset.bit);
      const press   = e => { setBit(bit);   el.classList.add('active');    el.setPointerCapture?.(e.pointerId); e.preventDefault(); };
      const release = e => { clearBit(bit); el.classList.remove('active'); e.preventDefault(); };
      el.addEventListener('pointerdown', press);
      el.addEventListener('pointerup', release);
      el.addEventListener('pointercancel', release);
      el.addEventListener('pointerleave', release);
    }

    // --- Rendering ----------------------------------------------------------
    // The renderer mirrors the desktop's GL camera (app/Main.hs runNetwork):
    // a 1° field of view looking down -z from height
    // camZ = sqrt((|vX|+|vY|+0.01)*10000) above the ship, so the view zooms
    // out with speed. Stars are world-space (x,y,z) points (z in
    // [-500,-200], from Core.Stars) re-sent only when the ship crosses a
    // chunk boundary; their depth gives parallax and brightness. The ship
    // and exhaust live on the z=-100 plane (the desktop's renderPoint), the
    // rocket polygon arriving in camera space.
    let STARS = [];

    function parsePoints(s) {
      return s.split(';').filter(Boolean).map(t => t.split(',').map(Number));
    }

    const TAN_HALF_FOV = Math.tan(Math.PI / 360); // GL.perspective fov of 1°

    globalThis.setStars = function (s) {
      STARS = parsePoints(s).map(([x, y, z]) => ({ x, y, z }));
    };

    globalThis.drawFrame = function (camX, camY, vX, vY, polyStr, particleStr) {
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      const w = canvas.width, h = canvas.height;

      const camZ = Math.sqrt((Math.abs(vX) + Math.abs(vY) + 0.01) * 10000);
      // NDC units per world unit on a plane `depth` below the ship plane.
      const scaleAt = depth => 1 / ((camZ + depth) * TAN_HALF_FOV);
      const toPx = (x, y, f) => [w / 2 + x * f * (w / 2), h / 2 - y * f * (h / 2)];

      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, w, h);

      for (const s of STARS) {
        const f = scaleAt(-s.z);
        const nx = (s.x - camX) * f, ny = (s.y - camY) * f;
        if (nx < -1 || nx > 1 || ny < -1 || ny > 1) continue;
        // Brightness from depth, as in the desktop's starColor.
        const v = Math.round(255 * Math.min(1, 1.1 - (Math.abs(s.z) - 200) / 300));
        const [px, py] = toPx(nx, ny, 1);
        ctx.fillStyle = 'rgb(' + v + ',' + v + ',' + v + ')';
        ctx.fillRect(px, py, 2, 2);
      }

      const fShip = scaleAt(100);

      // Thruster exhaust: world-space points on the ship plane, same colour
      // as the desktop's renderThrustParticles (orange, half-transparent).
      ctx.fillStyle = 'rgba(255,178,0,0.5)';
      for (const [x, y] of parsePoints(particleStr)) {
        const nx = (x - camX) * fShip, ny = (y - camY) * fShip;
        if (nx < -1 || nx > 1 || ny < -1 || ny > 1) continue;
        const [px, py] = toPx(nx, ny, 1);
        ctx.fillRect(px, py, 2, 2);
      }

      const pts = parsePoints(polyStr);
      ctx.beginPath();
      pts.forEach(([x, y], i) => {
        const [px, py] = toPx(x, y, fShip);
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      });
      ctx.closePath();
      ctx.fillStyle = '#fff';
      ctx.fill();

      document.getElementById('label').textContent =
        'netwire01 — x:' + camX.toFixed(2) + ' y:' + camY.toFixed(2);
    };
  </script>
  <!-- Load the Haskell game: a wasm32-wasi reactor module. The WASI shim
       provides the (tiny) syscall surface the GHC RTS needs; the generated
       ghc_wasm_jsffi.js (emitted by GHC's post-link.mjs at build time)
       carries the JSFFI import snippets from web/Main.hs. -->
  <script type="module">
    import { WASI, OpenFile, File, ConsoleStdout }
      from "https://cdn.jsdelivr.net/npm/@bjorn3/browser_wasi_shim@0.3.0/dist/index.js";
    import ghc_wasm_jsffi from "./ghc_wasm_jsffi.js";

    const fds = [
      new OpenFile(new File([])), // stdin
      ConsoleStdout.lineBuffered(msg => console.log(msg)),
      ConsoleStdout.lineBuffered(msg => console.warn(msg)),
    ];
    const wasi = new WASI([], [], fds);
    const instance_exports = {};
    const { instance } = await WebAssembly.instantiateStreaming(fetch("netwire01-web.wasm"), {
      wasi_snapshot_preview1: wasi.wasiImport,
      ghc_wasm_jsffi: ghc_wasm_jsffi(instance_exports),
    });
    Object.assign(instance_exports, instance.exports);
    wasi.initialize(instance);
    await instance.exports.hs_start();
  </script>
</body>
</html>
