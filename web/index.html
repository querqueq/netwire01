<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>netwire01 — web</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; }
    #stage { display: flex; align-items: center; justify-content: center; height: 100%; }
    canvas { background: #000; touch-action: none; max-width: 100vw; max-height: 100vh; }
    #label { position: fixed; top: 8px; left: 8px; color: #6f6; font: 14px/1.4 monospace; }
  </style>
</head>
<body>
  <div id="label">loading Haskell…</div>
  <div id="stage"><canvas id="canvas" width="600" height="600"></canvas></div>

  <script>
    // Stars are set once at startup by Haskell; the rocket polygon is sent
    // every frame. Both are "x,y[,b];..." strings in world coords ([-1,1],
    // +y up). worldToPx maps world coords to canvas pixels.
    let STARS = [];

    function parsePoints(s) {
      return s.split(';').filter(Boolean).map(t => t.split(',').map(Number));
    }

    function worldToPx(w, h, x, y) {
      return [w / 2 + x * (w / 2), h / 2 - y * (h / 2)];
    }

    globalThis.setStars = function (s) {
      STARS = parsePoints(s).map(([x, y, b]) => ({ x, y, b }));
    };

    globalThis.drawFrame = function (polyStr) {
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      const w = canvas.width, h = canvas.height;

      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, w, h);

      for (const s of STARS) {
        const [px, py] = worldToPx(w, h, s.x, s.y);
        const v = Math.round(s.b * 255);
        ctx.fillStyle = 'rgb(' + v + ',' + v + ',' + v + ')';
        ctx.fillRect(px, py, 2, 2);
      }

      const pts = parsePoints(polyStr);
      ctx.beginPath();
      pts.forEach(([x, y], i) => {
        const [px, py] = worldToPx(w, h, x, y);
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      });
      ctx.closePath();
      ctx.fillStyle = '#fff';
      ctx.fill();

      document.getElementById('label').textContent = 'netwire01 — rocket in starfield';
    };
  </script>
  <script src="all.js"></script>
</body>
</html>
